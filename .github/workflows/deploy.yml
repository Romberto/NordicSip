name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd front
          npm install

      - name: Build frontend
        run: |
          cd front
          npm run build  # создаст папку dist/

      - name: Prepare front folder on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf ${{ secrets.PROJECT_PATH }}/front/*
            mkdir -p ${{ secrets.PROJECT_PATH }}/front


      - name: Copy frontend build to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "front/dist/*"
          target: "${{ secrets.PROJECT_PATH }}/front/"